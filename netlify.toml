# 낯선 점술관 — Netlify 설정 (spec 14-5, 결정 93). 저장소 루트에 둔다. Netlify 화면 설정·push·환경 변수는 운영자가 한다.
# 배포 브랜치: Netlify 운영(production) 브랜치는 release. 에이전트는 main에만 커밋하고 release는 만지지 않는다.
#   QA 판정 "배포 가능" 뒤에만 운영자가 main → release 병합·push. main 브랜치 배포·미리보기 배포(deploy preview)는 끈다(HANDOFF 1장).
# 공개되는 것은 dist/public뿐이다. 제품 폴더·저장소 루트를 publish로 지정하지 않는다(유료 원본 api/_paid가 정적 주소로 새지 않게).

[build]
  command = "node tools/build-dist.js"   # 유료 문장 지문 누출·pay.mode off·api 폴더 검사가 실패하면 빌드가 멈춰 배포되지 않는다
  publish = "dist/public"

# (15단계 G3) Node 버전: @netlify/blobs 11은 Node 22.12 이상이 필요하다(package.json에는 engines 칸이 없다).
# NODE_VERSION은 빌드 이미지의 Node 버전이다. 함수 실행 환경도 이 값(22)을 따르는지는 미확인 — Netlify 문서상 함수는 빌드 Node 버전을 따르는 것이 기본이나,
# 운영자가 첫 배포 뒤 Netlify 화면(Functions → 함수 pay → Runtime)에서 Node.js 22 이상인지 확인한다. 아니면 환경 변수 AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"를 Netlify 화면에서 넣는다(미확인).
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  # 함수 book이 읽을 유료 원본. 함수 묶음에만 들어가고 정적 주소로는 내려받을 수 없다.
  included_files = ["products/strange-oracle/api/_paid/book/**"]

# 화면은 /api/book으로 부른다 → 함수로 잇는다. 1차 배포판(pay.mode off)은 부르지 않고,
# 환경 변수 PASS_MODE·BOOK_PASS_HASHES가 없으면 함수는 모든 요청에 503을 준다(안전).
[[redirects]]
  from = "/api/book"
  to = "/.netlify/functions/book"
  status = 200
  force = true

# (15단계, spec 15-3·15-7) 페이앱 결제: /api/pay/feedback·status·return → 함수 pay (경로 유지).
# 함수 pay는 PASS_MODE·PAYAPP_USERID·PAYAPP_LINKKEY·PAYAPP_LINKVAL·PASS_SECRET(32바이트 이상) 중 하나라도 없으면 503(안전).
# 결제 기록은 Netlify Blobs 저장소 "strange-oracle-pay"(strong). @netlify/blobs는 루트 package.json에 버전 고정(Node 22.12 이상 필요).
# included_files는 함수 book만 쓰지만 [functions] 공용 설정이라 그대로 둔다(pay 묶음에도 유료 원본이 들어가나 정적 주소로는 나가지 않음).
[[redirects]]
  from = "/api/pay/*"
  to = "/.netlify/functions/pay/:splat"
  status = 200
  force = true
