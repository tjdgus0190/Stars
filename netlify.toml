# 낯선 점술관 — Netlify 설정 (spec 14-5, 결정 93). 저장소 루트에 둔다. Netlify 화면 설정·push·환경 변수는 운영자가 한다.
# 배포 브랜치(2026-10-22 운영자 확인): Netlify 운영(production) 브랜치는 main. main에 push하면 바로 배포된다.
#   에이전트는 작업 브랜치에 커밋하고, 운영자가 승인할 때만 main에 반영한다(HANDOFF 1장).
# 공개되는 것은 dist/public뿐이다. 제품 폴더·저장소 루트를 publish로 지정하지 않는다(유료 원본 api/_paid가 정적 주소로 새지 않게).

[build]
  command = "node tools/build-dist.js"   # 유료 문장 지문 누출·pay.mode off·api 폴더 검사가 실패하면 빌드가 멈춰 배포되지 않는다
  publish = "dist/public"

# (15단계 G3) Node 버전: @netlify/blobs 11은 Node 22.12 이상이 필요하다(package.json에는 engines 칸이 없다).
# NODE_VERSION은 빌드 이미지의 Node 버전이다. 함수 실행 환경도 이 값(22)을 따르는지는 미확인 — Netlify 문서상 함수는 빌드 Node 버전을 따르는 것이 기본이나,
# 운영자가 첫 배포 뒤 Netlify 화면(Functions → 함수 pay → Runtime)에서 Node.js 22 이상인지 확인한다. 아니면 환경 변수 AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"를 Netlify 화면에서 넣는다(미확인).
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  # 함수 book이 읽을 유료 원본. 함수 묶음에만 들어가고 정적 주소로는 내려받을 수 없다.
  # (v1-D) 함수 talk가 읽는 안내자 설정·무료 해석 칸(공개 파일과 같은 것)
  included_files = ["products/strange-oracle/api/_paid/book/**", "products/strange-oracle/data-dex.js", "products/strange-oracle/data-saju.js", "products/strange-oracle/data-ogham.js", "products/strange-oracle/data-stars.js", "products/strange-oracle/data-decans.js", "products/strange-oracle/data-tzolkin.js", "products/strange-oracle/data-runes.js", "products/strange-oracle/data-oracles.js"]

# (2026-10-22) 함수는 새 형식(Functions v2, netlify/functions/*.mjs)이고 주소를 각 파일의 config.path로 정한다:
#   book.mjs → /api/book, pay.mjs → /api/pay/feedback·status·return. 옛 [[redirects]](→ /.netlify/functions/…)는 지웠다.
#   옛 Lambda 호환 형식은 Blobs strong 읽기에 필요한 값을 주지 않아 결제 확인이 503("store")이었다.
# (22단계, 운영자 2026-10-23) 사이트 주소(/)로 오면 서버에서 바로 입구로 보낸다. 루트 index.html(흰 화면 + 링크)은 이 설정이 없을 때만 쓰이는 예비.
#   주소 뒤 ?utm_… 같은 query는 Netlify가 그대로 넘긴다.
[[redirects]]
  from = "/"
  to = "/products/strange-oracle/"
  status = 301
  force = true

# (2026-11-12 운영자 결정) 2027 신년운세 광고 착지 주소: strange-oracle.com/2027 → 새해의 회랑(#ny-hub). query(utm_…)는 그대로 넘어간다.
#   신년운세 탭이 꺼진 동안(data.js ny.mode "off")은 입구가 그냥 열린다. 주소 뒤 #이 Netlify 이동에서 그대로 붙는지는 미확인 — 운영자가 배포 뒤 한 번 열어 확인
[[redirects]]
  from = "/2027"
  to = "/products/strange-oracle/#ny-hub"
  status = 302
  force = true

# (2026-11-13 운영자 결정: 짧은 주소) 안내 페이지·무료 도구. 파일은 products/strange-oracle/guide/<이름>/index.html(tools/strange-oracle/gen-guide.js가 만듦)이고
#   주소창은 짧은 주소 그대로(200 rewrite). canonical·sitemap도 짧은 주소를 쓴다. 끝 / 없는 주소는 / 붙은 주소로 보낸다.
# >>> gen-guide 짧은 주소 (tools/strange-oracle/gen-guide.js가 쓴다. 손으로 고치지 말 것)
