<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 별가루 결정(직접 그림, 2026-11-14): 네 갈래 큰 빛 + 대각선 작은 빛, 면마다 다른 푸른빛 -->
  <defs>
