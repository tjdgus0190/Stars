<!-- 전설 릴스 (2026-11-12, 운영자 "재미 부족, 첫 장면부터 재밌게, 더 자극적으로"): 카산드라 — 예언이 다 맞았지만 아무도 믿지 않은 트로이 공주.
     첫 프레임 = 노려보는 큰 눈 + 「그녀의 예언은 전부 맞았다」, 1.1초에 화면이 깨지며 「그런데 아무도 안 믿었다」. 아폴론의 선물 → 거절 → 저주 → 목마 경고 → 비웃는 댓글 → 문이 열림 → 하룻밤에 무너짐
     → 사전 카드("카산드라" = 맞는 말을 해도 아무도 믿지 않는 사람) → 「당신이라면 믿었을까?」 + 친구 태그. 그림(2026-11-12 운영자 "그래픽이 아쉬움" → 명화로): 메트로폴리탄 미술관 공개 작품(CC0) 모티머 「카산드라」·레가트 「광란의 카산드라」·레레스 「아폴론과 아우로라」·보나소네 「목마를 끌어들이는 트로이 사람들」·로랭 「함대에 불을 놓는 트로이 여인들」(legend/art/, CREDITS.md). 근거: 아이스킬로스 『아가멤논』, 아폴로도로스 『비블리오테케』 3.12.5, 베르길리우스 『아이네이스』 2권 -->
